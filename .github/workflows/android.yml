name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MONEYMATE_SUPABASE_URL: ${{ vars.MONEYMATE_SUPABASE_URL }}
      MONEYMATE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MONEYMATE_SUPABASE_PUBLISHABLE_KEY }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore persistent test signing key
        env:
          TEST_KEYSTORE: ${{ secrets.MONEYMATE_TEST_KEYSTORE }}
        run: |
          if [ -n "$TEST_KEYSTORE" ]; then
            printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/moneymate-test.p12"
            chmod 600 "$RUNNER_TEMP/moneymate-test.p12"
            echo "MONEYMATE_TEST_KEYSTORE_PATH=$RUNNER_TEMP/moneymate-test.p12" >> "$GITHUB_ENV"
            keytool -list -keystore "$RUNNER_TEMP/moneymate-test.p12" -storetype PKCS12 -storepass android -alias androiddebugkey
          else
            echo 'Signing secret unavailable: this run uses an ephemeral debug key.'
          fi
      - name: Run tests and build debug APK
        env:
          MONEYMATE_SUPABASE_URL: ${{ vars.MONEYMATE_SUPABASE_URL }}
          MONEYMATE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MONEYMATE_SUPABASE_PUBLISHABLE_KEY }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test account deletion authorization
        run: node --test supabase/functions/delete-account/handler.test.mjs
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android screens and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p screenshots
            adb pull /sdcard/Download/moneymate-screenshots/. screenshots/
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > screenshots/apk-certificate.txt
            grep -q '7bf330320f1084bed0f590db25269ad8559d3195a85ff3a1a4c442ed3d0f664c' screenshots/apk-certificate.txt
      - name: Upload Android screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneymate-visual-verification
          path: |
            screenshots/
            app/build/reports/androidTests/
            app/build/reports/tests/
      - name: Upload test APK and unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: moneymate-android-build
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
